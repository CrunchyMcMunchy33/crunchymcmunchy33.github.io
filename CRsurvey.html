<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Art of Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Texturina:ital,opsz,wght@0,12..72,100..900;1,12..72,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="widget-container">
        <h1>Music Survey</h1>
        <h3>Awnswer some questions about Underground Music</h2>
    <form id="surveyForm"></form>
        <div class="form-selection">
            <h2>Listner Info</h2>
            <label for="ListnerName">Your Name:</label>
            <input type="text" id="ListnerName" placeholder="Enter Your Name"
            <label for="PlatformName"> Your Streaming Platform:</label>
            <input type="text" id="PlatformName" placeholder="Enter Your Streaming Platform"

            <label for="FavoriteArtist">Your Favorite Artist:</label>
            <select id="FavoriteArtist">
                <option value="2Hollis">2Hollis</option>
                <option value="Nettspend">Nettspend</option>
                <option value="Osamason">Osamason</option>
                <option value="XavierSoBased"> XavierSoBased</option>
                <option value="Fakemink">Fakemink</option>
                <option value="other">Other</option>
                <input type="text" id="OtherArtist" placeholder="If Other, Please Specify">

            </select>
        </div>

        <div class="form-submission">
          <h2>Music Quiz</h2>
          <h3>Which artist has the most monthly listners</h3>
          <label>
            <input type="radio" name="monthlyListners" 
          </label>
            
        </form>
    </div>
  </body>
