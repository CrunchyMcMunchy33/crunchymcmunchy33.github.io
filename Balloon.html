<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Balloon</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f8fbff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    p#balloon {
      margin: 0;
      user-select: none;
      cursor: default;
      line-height: 1;
    }
  </style>
</head>
<body>
  <p id="balloon" aria-live="polite">🎈</p>

  <script>
    const balloon = document.getElementById('balloon');
    let size = 64; 
    const MIN_SIZE = 10; 
    const EXPLODE_THRESHOLD = 200; 

    function applySize() {
      balloon.style.fontSize = size + 'px';
    }
    applySize();

    function onKeyDown(event) {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      event.preventDefault();

      if (balloon.dataset.exploded === 'true') return;

      if (event.key === 'ArrowUp') {
        size = Math.round(size * 1.1); 
      } else {
        size = Math.round(size * 0.9); 
        if (size < MIN_SIZE) size = MIN_SIZE;
      }


      if (size > EXPLODE_THRESHOLD) {
        balloon.textContent = '💥';
        balloon.dataset.exploded = 'true';
        balloon.style.fontSize = (EXPLODE_THRESHOLD + 40) + 'px';
        document.removeEventListener('keydown', onKeyDown);
        return;
      }

      applySize();
    }

    document.addEventListener('keydown', onKeyDown);
  </script>
</body>
</html>
